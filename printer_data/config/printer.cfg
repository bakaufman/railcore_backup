#####################################################################
#	LED Control
#####################################################################

[output_pin caselight]
#  Chamber Lighting - In 5V-RGB Position
pin: PC8
pwm: true
shutdown_value: 0
cycle_time: 0.01

#####################################################################
#	Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 600

#[safe_z_home]
##	XY Location of the Z Endstop Switch
##	Update -10,-10 to the XY coordinates of your endstop pin 
##	(such as 157,305) after going through Z Endstop Pin
##	Location Definition step.
#home_xy_position: 140, 140
#speed:100
#z_hop:10
[homing_heaters] #BAK
steppers: stepper_z
heaters: extruder 

[bed_mesh]
speed: 250 #125
mesh_min: 2, 32 #BAK for probe offset
mesh_max: 290,260
mesh_pps: 2,2 
faulty_region_1_min: 15, 15
faulty_region_1_max: 45, 45
faulty_region_2_min: 140, 15
faulty_region_2_max: 170, 45
faulty_region_3_min: 265, 15
faulty_region_3_max: 295, 45
faulty_region_4_min: 15, 125
faulty_region_4_max: 45, 155
faulty_region_5_min: 140, 125
faulty_region_5_max: 170, 155
faulty_region_6_min: 265, 125
faulty_region_6_max: 295, 155
faulty_region_7_min: 15, 240
faulty_region_7_max: 45, 270
faulty_region_8_min: 140, 240
faulty_region_8_max: 170, 270
faulty_region_9_min: 265, 240
faulty_region_9_max: 295, 270

#horizontal_move_z: 5 #BAK added
probe_count: 6,6 #bak worked 9,9 #10, 10 #check for positions and make own grid 15, 15, 3, 3, 9,9
algorithm: bicubic
#relative_reference_index: 4 #40 #112, 4, 40
zero_reference_position: 145.5, 107 # bed: 300, 294. Offsets: 4.5, 30; therefore 150-4.5=145.5 and 137-30=107
adaptive_margin: 5

[homing_override]
axes: z
set_position_z: 0
gcode:
    G91
    G0 Z10 F750 #F600
    G928 X F5000 #1800
    G928 Y F5000 #1800
    #G0 X145 Y145 F2000 #only when not using mrwdeploy
    G90
    G0 X148 Y105 F5000
    mrwdeployprobe 
    G928 Z
    G4 P100
    mrwretractprobe
    G0 Z10 F750 #F700

[z_tilt] 
z_positions: #cut towers/screw mod, mrw kinematic and yokes, MRW bed
    -23, 7
    -23, 263
    330, 137 
points: #might be affected by your bed surface availability
     0, 0
     0, 233 #BAK 278
     298, 107  
retries: 4
retry_tolerance: 0.0075 #0.005 check
speed: 250              #   The speed (in mm/s) of non-probing moves during the calibration.
horizontal_move_z: 10   #   The height (in mm) that the head should be commanded to move to just prior to starting a probe operation.


[filament_switch_sensor Filament_sensor]
switch_pin: ^PB13
pause_on_runout: False
runout_gcode:
  PAUSE # [pause_resume] is required in printer.cfg
  M117 Filament switch runout
insert_gcode:
  M117 Filament switch inserted

[filament_motion_sensor encoder_sensor]
switch_pin: ^PA2 
detection_length: 10 #2.88
extruder: extruder
pause_on_runout: False
runout_gcode:
  PAUSE # [pause_resume] is required in printer.cfg
  M117 Filament encoder runout
insert_gcode:
  M117 Filament encoder inserted
