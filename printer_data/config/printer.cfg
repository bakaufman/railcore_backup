######################################################################
# Filament Change
######################################################################

# M600: Filament Change. This macro will pause the printer, move the
# tool to the change position, and retract the filament 50mm. Adjust
# the retraction settings for your own extruder. After filament has
# been changed, the print can be resumed from its previous position
# with the "RESUME" gcode.

[virtual_sdcard]
path: /home/pi/printer_data/gcodes
[display_status]
[exclude_object]
[include toolhead_btt_ebbcan_G0B1_v1.2.cfg]
[include macro.cfg]
[include shell_command.cfg]

[mcu]
restart_method: command
##	Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_2C001E000651393038383735-if00

[printer]
kinematics: corexy
max_velocity: 350 #200 #300  
max_accel: 3000 #20240115 2300 #20240903 #2500 #3000	#7000		        #Max 4000
#max_accel_to_decel: 7000 #for ringing testing
max_z_velocity: 10			#Max 15 for 12V TMC Drivers, can increase for 24V BAK 15
max_z_accel: 200 #350
square_corner_velocity: 5.0

[shaketune]

[input_shaper]
shaper_freq_x: 65.2 # center frequency for the X axis filter
shaper_type_x: 2hump_ei # filter type for the X axis
shaper_freq_y: 65.6 # center frequency for the Y axis filter
shaper_type_y: mzv # filter type for the Y axis
damping_ratio_x: 0.051 # damping ratio for the X axis
damping_ratio_y: 0.074 # damping ratio for the Y axis
#####################################################################
#      X/Y Stepper Settings
#####################################################################
[stepper_x]
##	Connected to E4-MOT (B Motor)
step_pin: PE1 
dir_pin: PE0 
enable_pin: !PC5 
rotation_distance: 32 
microsteps: 16 
full_steps_per_rotation:400  #set to 400 for 0.9 degree stepper
endstop_pin: ^PB14 
position_min: -28
position_endstop: -28
position_max: 300 
homing_positive_dir: false #changed with x min endstop 
homing_speed: 70   #Max 100 
homing_retract_dist: 5 # 3

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_x]
uart_pin: PD11 
interpolate: False
run_current: 1.0 #1.28 
#hold_current: 0.6
#sense_resistor: 0.110
#stealthchop_threshold: 999 

[stepper_y]
##	Connected to E3-MOT (A Motor)
step_pin: PD12
dir_pin: !PC4 
enable_pin: !PE8
rotation_distance: 32 
microsteps: 16 
full_steps_per_rotation:400  #set to 400 for 0.9 degree stepper BAK
endstop_pin: can0: LIMIT_1
position_min: 0
position_endstop: 0 
position_max: 294 #305 when I cut the z tower
homing_positive_dir: false 
homing_speed: 70  #Max 100 
homing_retract_dist: 5 # 3

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_y]
uart_pin: PA15 
interpolate: False
run_current: 1.0 #1.28 
#hold_current: 0.6 
sense_resistor: 0.110
#stealthchop_threshold: 999 

#####################################################################
#   Z Stepper Settings
#####################################################################
##	In X-MOT Position
##	Z Stepper - Front Left
[stepper_z]
step_pin: PE11 
dir_pin: PE10 
enable_pin: !PE9 
full_steps_per_rotation: 400
microsteps: 16
rotation_distance: 4
position_max: 275 
position_min: -5
homing_speed: 4 #  8
second_homing_speed: 1.5
homing_retract_dist: 3.5 #  4
endstop_pin: probe:z_virtual_endstop

[tmc2209 stepper_z]
uart_pin: PE7 
interpolate: False
run_current: 1.2 
#hold_current: 0.6 
#sense_resistor: 0.110
#stealthchop_threshold: 999 


## In Y-MOT position
## Z1 stepper - Back Left
[stepper_z1]
step_pin: PD8 
dir_pin: PB12 
enable_pin: !PD9 
full_steps_per_rotation: 400
microsteps: 16
rotation_distance: 4

[tmc2209 stepper_z1]
uart_pin: PE15 
interpolate: False
run_current: 1.2 
#hold_current: 0.6 
#sense_resistor: 0.110
#stealthchop_threshold: 999


##	In E1-MOT Position
##	Z2 Stepper - Right
[stepper_z2]
step_pin: PE6 
dir_pin: PC13 
enable_pin: !PE5 
full_steps_per_rotation: 400 
microsteps: 16
rotation_distance: 4

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z2]
uart_pin: PC14 
interpolate: False
run_current: 1.2 
#hold_current: 0.6 
#sense_resistor: 0.110
#stealthchop_threshold: 999 

