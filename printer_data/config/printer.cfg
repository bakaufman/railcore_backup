#####################################################################
#	Macros
#####################################################################


    
[gcode_macro G32]
gcode:
    mrwdeployprobe
    Z_TILT_ADJUST
    G0 X150 Y150 F4000
    G928 Z

[gcode_macro GO_HOME]
gcode:    
    G91
    G1 Z5
    G90
    G1 X0Y0
    G91
    G1 Z-5
    G90

[gcode_macro PRINT_START]
#   Use PRINT_START for the slicer starting script - please customize for your slicer of choice
gcode:
    G28 ; XYZ homing
    G32 ; z align
    BED_MESH_CLEAR #comment out if you want to save time.
    BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN=5 #same. leave on for better first layer.
    BED_MESH_PROFILE LOAD=default #PEI
    BED_MESH_MAP



[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-.5 F3600                ; retract filament
    G91                            ; relative positioning
    G0 Z1.00 X20.0 Y20.0 F20000    ; move nozzle to remove stringing
    TURN_OFF_HEATERS
    M107                           ; turn off fan
    G1 Z2 F3000                    ; move nozzle up 2mm
    G90                            ; absolute positioning
    G0  X10 Y290 F3600            ; park nozzle at rear
    # Lower bed 89 unless bed is too close to bottom of printer, then lower to -11
    {% if printer.toolhead.axis_maximum.z - printer.toolhead.position.z > 100 %}
        G1 Z{printer.toolhead.position.z + 89}
    {% else %}
        G1 Z{printer.toolhead.axis_maximum.z - 11}
    {% endif %}
    M400
    M84
    M117 Done
    
