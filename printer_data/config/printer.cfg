##   "EPCOS 100K B57560G104F"
##   "ATC Semitec 104GT-2"
##   "NTC 100K beta 3950"
##   "Honeywell 100K 135-104LAG-J01"
##   "NTC 100K MGB18-104F39050L32" (Keenovo Heater Pad)
##   "AD595"
##   "PT100 INA826"

[pause_resume]

[gcode_macro M600]
gcode:
    {% set X = params.X|default(50)|float %}
    {% set Y = params.Y|default(0)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=M600_state
    PAUSE
    G91
    G1 E-.8 F2000 #2700
    M117 Unloading Filament
    RESPOND TYPE=command MSG="Unloading Filament"
    G1 Z{Z}
    G90
    G1 X{X} Y{Y} F3000
    G91
    UNLOAD_FILAMENT
    M117 Use menu to load
    RESPOND TYPE=command MSG="Use menu to load new filament"
    RESTORE_GCODE_STATE NAME=M600_state

[gcode_macro UNLOAD_FILAMENT]
variable_unload_distance:  150
variable_purge_distance:  25
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity  * 60 %}
    SAVE_GCODE_STATE NAME=load_state
    G91
    G92 E0
    G1 E{load_distance} F{max_velocity} # fast-load
    G1 E{purge_distance} F{speed} # purge
    RESTORE_GCODE_STATE NAME=load_state

variable_load_distance:  125
[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    {% set X = params.X|default(230)|float %}
    {% set Y = params.Y|default(230)|float %}
    {% set Z = params.Z|default(10)|float %}
    M104 S0
    M140 S0
    M141 S0
    M106 S0
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    BASE_CANCEL_PRINT

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    {% set X = params.X|default(230)|float %}
    {% set Y = params.Y|default(230)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    M117 Pausing
#    M118 Pausing
    G91
    G1 E-.8 F2100
    G1 Z{Z}
    G90
    G1 X{X} Y{Y} F6000
    G91

[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    M117 Resuming
#    M118 Resuming
    G91
    G1 E.8 F2100
    G91
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1
    BASE_RESUME

[idle_timeout] 
timeout: 3600
gcode:
    {% if printer.pause_resume.is_paused %}
#        M118 Bypassed Timeout
        M117 Bypassed Timeout
    {% else %}
#        M118 Timeout Reached - Heaters and Motors Still On!
        M117 Timeout Reached - Heaters and Motors Still On!
        #TURN_OFF_HEATERS
        #M84
    {% endif %}
    
[gcode_macro mrwretractprobe]
gcode:
  SAVE_GCODE_STATE NAME=probe_deployed
  G90
  G0 F700 Z10 
  G0 F5000 X0. Y287 #initial approach
  G0 F3000 X-28.  #position pin to access ramp
  G0 F2000 Y292   #approach arm, don't dig the head in too far
  G0 F200 X-15  #up ramp but without rotating
  G0 F200 X-12 #rotating
  G0 F200 X-9 Y289 # turn pin
  G0 F5000 X35 Y200
  G0 F5000 X150 Y150  
  RESTORE_GCODE_STATE NAME=probe_deployed

[gcode_macro mrwdeployprobe]
; deploy mrw probe
gcode:
  SAVE_GCODE_STATE NAME=probe_not_deployed
  G90
  G0 F700 Z10 
  G0 F5000 X5. Y294 #align screw with wedge
  G0 F3000 X-4.  #just about touching
  #G0 F2000 X6. Y293  #dig in
  G0 F200 X-7. #deploy
  G0 F5000 X35 Y291 #retreat
  G0 F5000 X150 Y150 # neutral position 
  RESTORE_GCODE_STATE NAME=probe_not_deployed

[gcode_macro G28]
rename_existing: G928
gcode:
    G928
    #mrwretractprobe

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_ORIGINAL
gcode: 
  mrwdeployprobe
  BED_MESH_CALIBRATE_ORIGINAL ADAPTIVE=1
  mrwretractprobe

[gcode_macro Full_Monte]
gcode:
  g28
  g32
  bed_mesh_calibrate

[gcode_macro LEDOFF]
gcode:  SET_PIN PIN=caselight VALUE=0

[gcode_macro LEDMIN]
gcode:  SET_PIN PIN=caselight VALUE=.5

[gcode_macro LEDMAX]
gcode:  SET_PIN PIN=caselight VALUE=1

