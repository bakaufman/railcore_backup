#####################################################################
#   Bed Heater
#####################################################################
[heater_bed]
##	SSR Pin - In BED OUT position
heater_pin: PB4
sensor_type: Generic 3950 #NTC 100K beta 3950 
sensor_pin: PC3 # TB Position
##	Adjust Max Power so your heater doesn't warp your bed
max_power: 1 
min_temp: 0
max_temp: 130 
#control: pid


#####################################################################
#	Probe
#####################################################################

[probe]
##	This is the strike point probe on MRW mount on MRW carriage plate
pin: can0: PROBE_2
x_offset: -2.5 
y_offset: 32
#z_offset: 0
speed: 4 #10.0
samples: 3 #4
samples_result: median
sample_retract_dist: 5 #3.5 BAK
samples_tolerance: 0.05 
samples_tolerance_retries: 10 



