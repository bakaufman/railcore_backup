# This file stores the flash_commands for each mcus
# Previous version KCONFIG_CONFIG was needed now it is automaticly added when make flash is called
# version : 0.1
# tested/supported flash methods :
#  - make flash
#  - sdcard_flash
#  - flashtool.py
#  - mount/cp/umount (for rp2040)
 
#[rpi]
#klipper_section: mcu rpi
#action_command: make flash

[spider]
klipper_section: mcu
# usb-serial port (using bootloader_usb.py)
#action_command: python3 ~/ukam/bootloader_usb.py /dev/serial/by-id/usb-Klipper_stm32f446xx_2C001E000651393038383735-if00
#quiet_command: sleep 1
action_command: python3 ~/katapult/scripts/flashtool.py -d /dev/serial/by-id/usb-katapult_stm32f446xx_2C001E000651393038383735-if00 -b 250000

[toolhead]
klipper_section: mcu can0
action_command: ~/katapult/scripts/flashtool.py -u 44e6c615b844

